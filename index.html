<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paws and Planet | Explore the Animal Kingdom</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <style>
    body {
      position: relative;
  
    }
  
    .window {
      height: 200px;
      text-align: center;
      padding-top: 75px;
      font-size: 60px;
      color: white;
    }
  
    .forest {
      background-color: darkgreen;
    }
  
    .ocean {
      background-color: aqua;
    }
  
    .mountains {
      background-color: brown;
    }
  </style>
</head>
<body data-page="home">
  <div id="navbar"></div>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Paws <span>&amp;</span> Planet 🌿</h1>
        <p class="lead">Take a moment to pause and discover the amazing animals that share our planet, from tiny invertebrates to mighty mammals.</p>
        <div class="carousel slide" id="safari" data-ride="carousel">
          <ol class="carousel-indicators">
            <li data-target="#safari" data-slide-to="0" class="active"></li>
            <li data-target="#safari" data-slide-to="1"></li>
            <li data-target="#safari" data-slide-to="2"></li>
          </ol>
          <div class="carousel-inner">
            <div class="carousel-item active window forest">forest safari</div>
            <div class="carousel-item  window ocean">ocean safari</div>
            <div class="carousel-item  window mountains">mountains safari</div>
          </div>
          <a class="carousel-control-prev" href="#safari" data-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </a>
          <a class="carousel-control-next" href="#safari" data-slide="next">
            <span class="carousel-control-next-icon"></span>
          </a>
        
        </div>
        <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
        
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
        <a href="mammals.html" class="btn btn-pp btn-lg">Start Exploring</a>
      </div>
    </section>

    <section class="container pb-4">
      <h2 class="text-center mb-4" style="color:#1f4d33;font-weight:700;">Choose a Category</h2>
      <div class="row g-4" id="categoryGrid"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
